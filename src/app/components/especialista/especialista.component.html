<div class="especialista-container">
  <h2>Panel del Especialista</h2>
  
  <div class="botones-panel">
    <!-- Botón para ir a Turnos Especialista -->
    <button (click)="navegarATurnos()" class="btn btn-primary">
      📅 Gestionar Turnos
    </button>

    <!-- Botón para ir a Horarios -->
    <button (click)="navegarAHorarios()" class="btn btn-secondary">
      ⏰ Configurar Horarios
    </button>
  </div>

  <!-- Resto del contenido del panel especialista -->
  <div class="panel-content">
    <p>Bienvenido al panel de especialista. Desde aquí puedes:</p>
    <ul>
      <li>Gestionar tus turnos asignados</li>
      <li>Configurar tu disponibilidad horaria</li>
      <li>Ver tu perfil y especialidades</li>
    </ul>
  </div>
</div>
