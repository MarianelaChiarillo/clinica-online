<h1>Mis Turnos</h1>

<div class="container">

  <!-- 🔵 UN SOLO FILTRO -->
  <app-filtro-general
    placeholder="Buscar por especialista o especialidad..."
    (filtroChange)="filtrar($event)">
  </app-filtro-general>

  <!-- 🗂️ LISTA DE TURNOS -->
  <div class="turno-list">

    <div class="turno-card" *ngFor="let t of turnosFiltrados">

      <div class="turno-header">
        <strong>{{ t.fecha_turno }} - {{ t.hora_inicio }}</strong>
        <span class="estado {{ t.estado | lowercase }}">
          {{ t.estado }}
        </span>
      </div>

      <div><b>Especialidad:</b> {{ t.especialidades?.nombre }}</div>

      <div>
        <b>Especialista:</b>
        {{ t.especialistas?.nombre }} {{ t.especialistas?.apellido }}
      </div>

      <!-- Mostrar calificación si existe -->
      <div *ngIf="t.calificacion_atencion">
        <b>Calificación:</b> {{ t.calificacion_atencion }} ⭐
      </div>
<div class="acciones">

  <!-- CANCELAR -->
  <button
    *ngIf="acciones(t).includes('cancelar')"
    (click)="cancelar(t)"
    class="btn cancelar">
    Cancelar
  </button>

  <!-- COMPLETAR ENCUESTA -->
  <button
    *ngIf="acciones(t).includes('completar_encuesta')"
    (click)="completarEncuesta(t)"
    class="btn info">
    Completar Encuesta
  </button>

  <!-- CALIFICAR -->
  <button
    *ngIf="acciones(t).includes('calificar')"
    (click)="calificar(t)"
    class="btn calificar">
    Calificar
  </button>

  <!-- VER RESEÑA -->
  <button
    *ngIf="acciones(t).includes('ver_resena')"
    (click)="verComentario(t)"
    class="btn info">
    Ver Reseña
  </button>

</div>


    </div>

  </div>

  <!-- ============================= -->
  <!--           MODALES             -->
  <!-- ============================= -->

  <!-- MODAL CANCELAR -->
  <app-cancelar-turno-modal
    *ngIf="modalCancelar"
    [turno]="turnoSeleccionado"
    (cerrar)="onModalClose($event)">
  </app-cancelar-turno-modal>

  <!-- MODAL VER COMENTARIO -->
  <app-comentario-turno-modal
    *ngIf="modalComentario"
    [turno]="turnoSeleccionado"
    (cerrar)="onModalClose($event)">
  </app-comentario-turno-modal>

  <!-- MODAL CALIFICAR -->
  <app-calificar-turno-modal
    *ngIf="modalCalificar"
    [turno]="turnoSeleccionado"
    (cerrar)="onModalClose($event)">
  </app-calificar-turno-modal>

</div>
