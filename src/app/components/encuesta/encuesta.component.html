<div class="modal-backdrop" (click)="cerrarModal()">
  <div class="modal" (click)="$event.stopPropagation()">
    <h3>Encuesta de Satisfacción</h3>

    <div class="pregunta" *ngFor="let pregunta of preguntas">
      <label>{{ pregunta.texto }}</label>
      <div class="rating">
        <button
          *ngFor="let n of [1,2,3,4,5]"
          (click)="marcarRespuesta(pregunta.campo, n)"
          [class.active]="respuestas[pregunta.campo] === n"
          class="rating-btn"
          type="button"
        >
          {{ n }}
        </button>
      </div>
      <small class="pista">{{ pregunta.pista }}</small>
    </div>

   <div class="form-group">
  <label>Comentarios adicionales (opcional)</label>
  <textarea
    [(ngModel)]="respuestas.comentarios"
    rows="3"
    placeholder="¿Algún comentario o sugerencia para mejorar nuestro servicio?"
  ></textarea>
</div>

    <div class="error" *ngIf="error">{{ error }}</div>

    <div class="actions">
      <button class="btn ghost" (click)="cerrarModal()" [disabled]="enviando">
        Cancelar
      </button>

      <button
        class="btn primary"
        (click)="guardarEncuesta()"
        [disabled]="!encuestaEstaCompleta() || enviando"
      >
        {{ enviando ? 'Enviando...' : 'Enviar Encuesta' }}
      </button>
    </div>
  </div>
</div>
