<div class="modal-backdrop">
  <div class="modal">
    <h3>Finalizar turno</h3>

    <label>Reseña / Comentario del especialista (opcional)</label>
    <textarea [(ngModel)]="resenia" rows="4" placeholder="Diagnóstico, observaciones..."></textarea>

    <label>
      <input type="checkbox" [(ngModel)]="crearEncuesta" /> Crear encuesta para el paciente
    </label>

    <div *ngIf="crearEncuesta" class="encuesta">
      <label>Pregunta 1</label>
      <input [(ngModel)]="encuestaRespuestas.p1" />
      <label>Pregunta 2</label>
      <input [(ngModel)]="encuestaRespuestas.p2" />
      <label>Pregunta 3</label>
      <input [(ngModel)]="encuestaRespuestas.p3" />
      <label>Observaciones</label>
      <textarea [(ngModel)]="encuestaRespuestas.observaciones"></textarea>
    </div>

    <div class="error" *ngIf="error">{{ error }}</div>

    <div class="actions">
      <button class="btn ghost" (click)="cerrarModal()" [disabled]="saving">Cerrar</button>
      <button class="btn primary" (click)="confirmarFinalizar()" [disabled]="saving">
        {{ saving ? 'Guardando...' : 'Finalizar turno' }}
      </button>
    </div>
  </div>
</div>
