<div class="modal-backdrop">
  <div class="modal">
    <h3>Reseña / Comentarios</h3>

    <div *ngIf="turno.resenia_del_especialista">
      <h4>Reseña del especialista</h4>
      <p>{{ turno.resenia_del_especialista }}</p>
    </div>

    <div *ngIf="turno.comentario_calificacion">
      <h4>Reseña del paciente</h4>
      <p>{{ turno.comentario_calificacion }}</p>
    </div>

    <div *ngIf="!turno.resenia_del_especialista && !turno.comentario_calificacion">
      <p>No hay reseñas disponibles.</p>
    </div>

    <div class="actions">
      <button class="btn" (click)="cerrarModal()">Cerrar</button>
    </div>
  </div>
</div>
