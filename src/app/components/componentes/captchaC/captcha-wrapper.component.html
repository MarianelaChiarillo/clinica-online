<div class="captcha-module-wrapper">

<div *ngIf="captchaEnabled && !captchaVisible" class="captcha-show-btn">
  <button (click)="mostrarCaptcha()">Completar CAPTCHA</button>
</div>

<div *ngIf="captchaVisible && captchaEnabled" class="captcha-container">
  <div appCaptcha
       [enabled]="captchaEnabled"
       [captchaValido]="captchaValido"
       [imagenes]="imagenes"
       (seleccionToggled)="onSeleccionToggled($event)"
       (verificarSolicitado)="onVerificarSolicitado()">
    
    <div *ngIf="captchaValido" class="captcha-success">
      <div class="success-icon">✓</div>
      <p>¡Captcha validado correctamente!</p>
    </div>

    <ng-container *ngIf="!captchaValido">
      <div class="instructions">
        <p *ngIf="objetivo">
          Selecciona todas las imágenes de: <strong>{{ objetivo }}</strong>
        </p>
      </div>

      <div class="images" *ngIf="!cargando && imagenes.length > 0">
        <div *ngFor="let img of imagenes"
             class="image-item"
             [class.selected]="seleccionadas.includes(img.id)"
             (click)="onSeleccionToggled(img.id)">
          <img [src]="img.src" alt="Imagen captcha" />
        </div>
      </div>

      <div class="actions" *ngIf="!cargando">
        <button (click)="onVerificarSolicitado()" 
                [disabled]="seleccionadas.length === 0">
          Verificar
        </button>
        <button (click)="generarNuevoCaptcha()">
          Recargar
        </button>
      </div>
    </ng-container>
  </div>
</div>

<div *ngIf="!captchaEnabled" class="captcha-disabled">
  <div class="disabled-icon">✓</div>
  <p>CAPTCHA deshabilitado</p>
</div>

<div class="captcha-toggle">
  <label class="switch">
    <input type="checkbox" [(ngModel)]="captchaEnabled" (change)="onToggleCaptcha()">
    <span class="slider"></span>
  </label>
  <span class="toggle-label">
    {{ captchaEnabled ? 'Deshabilitar CAPTCHA' : 'Habilitar CAPTCHA' }}
  </span>
</div>


</div>
