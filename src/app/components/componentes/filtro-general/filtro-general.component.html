<div class="filtro-container">
  <span class="icono-busqueda">🔍</span>

  <input
    type="text"
    [(ngModel)]="textoFiltro"
    (input)="onInputChange($event)"
    [placeholder]="placeholder"
    class="filtro-input"
  />

  <button *ngIf="textoFiltro" class="btn-limpiar" (click)="limpiarFiltro()">
    ✖
  </button>
</div>
